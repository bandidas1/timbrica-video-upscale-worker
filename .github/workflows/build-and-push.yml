name: build-and-push

# Собрать образ воркера и положить в GHCR, откуда RunPod его тянет.
#
# ЗАЧЕМ ЭТО ЗДЕСЬ, А НЕ «соберу локально и запушу»: у образа база
# runpod/pytorch:…-devel-… (двузначное число гигабайт), и единственный способ
# отдать её в реестр без ручных учёток — собрать внутри Actions, где
# GITHUB_TOKEN имеет packages:write по умолчанию. Никаких секретов заводить не
# нужно.
#
# ⚠️ Раннер GitHub приезжает с ~14 ГБ свободного места на /, чего этой базе не
# хватает. Первым шагом сносим предустановленные тулчейны (~25 ГБ) — без этого
# сборка падает на «no space left on device» уже после нескольких минут pull'а.

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths: ['Dockerfile', 'handler.py', 'delivery_selftest.py', '.github/workflows/build-and-push.yml']

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      # Delivery of the finished file is where a paid job was lost on
      # 2026-11-01 (98 %, then cancelled with the result on this worker's
      # disk). The self-check runs the real _deliver_result against a fake
      # door with the server's part semantics: no image is built past a red one.
      - name: Delivery self-check
        run: python3 delivery_selftest.py

      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          sudo docker image prune -af || true
          df -h /

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # `latest` — то, на что смотрит шаблон RunPod; тег по SHA оставляет
          # точку отката, если новая сборка окажется хуже.
          tags: |
            ghcr.io/${{ github.repository_owner }}/timbrica-video-upscale-worker:latest
            ghcr.io/${{ github.repository_owner }}/timbrica-video-upscale-worker:${{ github.sha }}
          provenance: false

      - name: Say what to point RunPod at
        run: |
          echo "imageName: ghcr.io/${{ github.repository_owner }}/timbrica-video-upscale-worker:latest"
          echo "Сделать пакет ПУБЛИЧНЫМ, иначе RunPod не сможет его вытянуть."
